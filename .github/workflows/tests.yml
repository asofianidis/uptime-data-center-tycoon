name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  editmode-tests:
    name: Unity edit-mode tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check for Unity license secrets
        id: license
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_EMAIL" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license secrets are not configured, so tests were skipped. See README (Continuous integration)."
          fi

      - uses: actions/checkout@v4
        if: steps.license.outputs.available == 'true'
        with:
          lfs: true

      - uses: actions/cache@v4
        if: steps.license.outputs.available == 'true'
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run edit-mode tests
        if: steps.license.outputs.available == 'true'
        uses: game-ci/unity-test-runner@v4
        with:
          unityVersion: 6000.6.9f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Edit-mode test results

      - uses: actions/upload-artifact@v4
        if: always() && steps.license.outputs.available == 'true'
        with:
          name: test-results
          path: artifacts
